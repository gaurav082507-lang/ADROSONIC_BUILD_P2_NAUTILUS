services:
  - type: web
    name: lucenai-backend
    runtime: python
    buildCommand: |
      cd backend && pip install -r requirements.txt
    startCommand: |
      cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEMO_MODE
        value: "1"
      - key: LOG_CLAIM_INTAKE
        value: "0"
    healthCheckPath: /api/v1/health
    autoDeploy: true

  - type: web
    name: lucenai-frontend
    runtime: static
    buildCommand: |
      cd web && npm install && npm run build
    staticPublishPath: web/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://lucenai-backend.onrender.com
