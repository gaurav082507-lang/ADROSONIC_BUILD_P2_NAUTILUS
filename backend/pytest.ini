[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    slow: marks tests as slow (run with -m slow or all)
    live: marks tests as live external service tests (deselect with -m "not live")
filterwarnings =
    ignore::DeprecationWarning:starlette\.testclient.*
    ignore::DeprecationWarning:httpx\._client.*
