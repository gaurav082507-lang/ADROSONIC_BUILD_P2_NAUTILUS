<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1220" />
    <meta name="description" content="Lucen AI — forensic claim intelligence." />
    <title>Lucen AI</title>
    <style>
      html,body,#root{min-height:100%;margin:0}
      body{background:#F5F7FA}
      #boot-screen{min-height:100vh;display:grid;place-items:center;font:14px Inter,system-ui,sans-serif;color:#0F1B2D}
      #boot-screen .boot-card{padding:28px 32px;border:1px solid #E3E8EF;border-radius:16px;background:#fff;box-shadow:0 12px 32px rgba(15,27,45,.08);text-align:center}
      #boot-screen strong{display:block;font-size:18px;margin-bottom:6px}
      #boot-error{display:none;max-width:720px;margin:24px auto;padding:20px;border-radius:12px;background:#fff;border:1px solid #fecaca;color:#7f1d1d;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-screen"><div class="boot-card"><strong>Lucen AI</strong><span>Loading forensic claim intelligence…</span></div></div>
      <pre id="boot-error"></pre>
    </div>
    <script>
      window.addEventListener('error', function (event) {
        var box=document.getElementById('boot-error');
        if(box){box.style.display='block';box.textContent='Lucen AI failed to start.\n\n'+(event.error?.stack || event.message || 'Unknown runtime error');}
      });
      window.addEventListener('unhandledrejection', function (event) {
        var box=document.getElementById('boot-error');
        if(box){box.style.display='block';box.textContent='Lucen AI failed to start.\n\n'+(event.reason?.stack || String(event.reason));}
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
